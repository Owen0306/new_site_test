<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Site</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 20px;
      box-sizing: border-box;
    }

    .pdf-container {
      width: 100%;
      height: calc(100vh - 120px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Hello World</h1>
    <p>This is my first GitHub site.</p>
  </div>

  <div class="pdf-container">
    <iframe
      src="./pdf/More-series.pdf#toolbar=0"
      width="100%"
      height="100%"
      style="border:0;">
    </iframe>
  </div>

</body>
</html>
